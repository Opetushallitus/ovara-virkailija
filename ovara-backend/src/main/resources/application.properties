spring.application.name=ovara-backend
server.servlet.context-path=/ovara-backend

# Spring Boot 4 käyttäisi oletuksena Jackson 3:a HTTP-pyyntöjen ja -vastausten JSON-muunnoksiin.
# Pakotetaan Jackson 2, jotta käytössä on JsonConfiguration-luokan ObjectMapper (Scala-moduuli,
# päivämäärämuotoilut). Jackson 3:lle voidaan siirtyä, kun jackson-module-scala ja json4s tukevat sitä.
spring.http.converters.preferred-json-mapper=jackson2

spring.datasource.hikari.maximum-pool-size=20

session.schema.name=ovara_virkailija
#1h session timeout
server.servlet.session.timeout=1h

#swagger-ui config
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=alpha

#1 hr caching for translations
caching.spring.lokalisointiTTL=3600000

#1 hr caching for alkamisvuodet
caching.spring.alkamisvuodetTTL=3600000

#30min caching for asiointikieli
caching.spring.asiointikieliTTL=1800000
logging.level.fi.oph.ovara.backend.repository=DEBUG

#korkeakoulujen päätettävät opiskeluoikeudet -JSON-rajapinta (api/kk-paatettavat-opiskeluoikeudet/json)
yos-json-rajapinta-enabled=false
