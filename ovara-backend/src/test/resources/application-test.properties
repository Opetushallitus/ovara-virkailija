opintopolku.virkailija.url=https://virkailija.testiopintopolku.fi
cas.url=${opintopolku.virkailija.url}/cas
ovara.ui.url=https://localhost:3405
ovara.backend.url=https://localhost:8443/ovara-backend
ovara-backend.cas.username=ovara-backend
ovara-backend.cas.password=foobar
session.schema.name=ovara_virkailija
# Testcontainers käynnistää PostgreSQL-kontin ensimmäisellä yhteydellä ja jakaa sen kaikille saman URL:n käyttäjille.
# TC_DAEMON pitää kontin käynnissä koko testiajon ajan, vaikka yhteydet välillä suljettaisiin.
spring.datasource.url=jdbc:tc:postgresql:18.3:///ovara?TC_DAEMON=true
app.readonly.datasource.url=jdbc:tc:postgresql:18.3:///ovara?TC_DAEMON=true
spring.datasource.driverClassName=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test
spring.flyway.locations=classpath:/src/main/resources/db/migration
#1 hr caching for translations
caching.spring.lokalisointiTTL=3600000
#1 hr caching for alkamisvuodet
caching.spring.alkamisvuodetTTL=3600000
#1 day caching for asiointikieli
caching.spring.asiointikieliTTL=86400000
yos-json-rajapinta-enabled=true
